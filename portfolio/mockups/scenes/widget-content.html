<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>widget content</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { width: 920px; height: 182px; }
  .stage { width: 100%; height: 100%; padding: 18px; display: flex; align-items: stretch; justify-content: center; gap: 12px; }
  .widget { width: 210px; height: 140px; border-radius: 22px; padding: 13px 14px; display: flex; flex-direction: column; }
  .widget-title { font-size: 16px; }
  .widget-desc { font-size: 8.5px; }
  .widget--text-image .widget-art { margin-top: 6px; flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: flex-start; }
  .widget--text-image .widget-art img { width: 100%; max-height: 100%; object-fit: contain; object-position: top left; }
  .widget--image-only { padding: 10px 11px; }
  .widget--image-only .widget-brand { margin-bottom: 4px; }
  .widget--image-only .widget-art { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: flex-start; }
  .widget--image-only .widget-art img { width: 100%; height: 100%; max-height: 100%; object-fit: contain; object-position: top left; }
</style>
</head>
<body>
  <div class="stage">
    <article class="widget widget--solid">
      <div class="widget-brand"><img src="../../assets/mark-white.svg" alt="">Today</div>
      <h2 class="widget-title">How to Fend Off a Shark</h2>
      <p class="widget-desc">Hit back at the eyes or gills. Do not play dead; a shark reads stillness as prey.</p>
    </article>

    <article class="widget widget--solid widget--text-image">
      <div class="widget-brand"><img src="../../assets/mark-white.svg" alt="">Today</div>
      <h2 class="widget-title">How to Fend Off a Shark</h2>
      <p class="widget-desc">Hit back at the eyes or gills…</p>
      <div class="widget-art"><img src="../art/shark.svg" alt=""></div>
    </article>

    <article class="widget widget--solid">
      <div class="widget-row" style="height: 100%">
        <div class="widget-copy">
          <div class="widget-brand"><img src="../../assets/mark-white.svg" alt="">Today</div>
          <h2 class="widget-title">How to Fend Off a Shark</h2>
          <p class="widget-desc">Hit back at the eyes or gills…</p>
        </div>
        <div class="widget-art"><img src="../art/shark.svg" alt=""></div>
      </div>
    </article>

    <article class="widget widget--solid widget--image-only">
      <div class="widget-brand"><img src="../../assets/mark-white.svg" alt="">Today</div>
      <div class="widget-art"><img src="../art/shark.svg" alt=""></div>
    </article>
  </div>
</body>
</html>
