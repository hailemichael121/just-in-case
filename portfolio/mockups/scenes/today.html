<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>today</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { width: 390px; height: 844px; }
  .app { padding: 20px 22px 22px; }
  .app-card { padding: 20px; }
  .app-title { font-size: 36px; }
  .app-art { padding: 14px; }
  .app-actions .btn-solid, .app-actions .btn-line { min-height: 42px; }
</style>
</head>
<body>
  <div class="app">
    <div class="app-head">
      <span class="app-kicker"><img src="../../assets/mark-white.svg" alt="">The Best Defense</span>
      <span class="round" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
    </div>

    <article class="app-card">
      <span class="app-chapter"><span class="widget-dot"></span>The Best Defense</span>
      <h1 class="app-title">How to Fend Off a Shark</h1>
      <p class="app-desc">Hit back at the eyes or gills. Do not play dead — a shark reads stillness as prey.</p>
      <div class="app-art"><img src="../art/shark.svg" alt=""></div>
      <div class="app-actions">
        <span class="btn-solid">Read</span>
        <span class="btn-line">Another one</span>
      </div>
    </article>

    <p class="app-note">Swipe the card for another how-to. The widget keeps the day’s one.</p>
  </div>
</body>
</html>
