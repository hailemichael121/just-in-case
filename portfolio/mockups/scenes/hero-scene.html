<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hero scene</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { width: 390px; height: 844px; }
  .home { padding: 22px 22px 24px; }
  .hero-notch { display: flex; justify-content: center; padding-bottom: 14px; }
  .hero-notch i { width: 96px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .hero-stack { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 18px 0 40px; }
  .hero-medium { width: 100%; height: 150px; padding: 16px 18px; }
  .hero-medium .widget-title { font-size: 22px; }
  .hero-medium .widget-desc { font-size: 10.5px; }
  .hero-small { margin-left: 8px; }
</style>
</head>
<body>
  <!-- All scene colours are greyscale; the site itself stays paper. -->
  <div class="home">
    <div class="hero-notch"><i></i></div>
    <div class="status">
      <span>08:00</span>
      <span class="icons" aria-hidden="true">
        <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M1 4.5C4.4 1.2 9.6 1.2 13 4.5M3.4 7C5.5 5 8.5 5 10.6 7M5.9 9.4a1.5 1.5 0 0 1 2.2 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <svg width="13" height="12" viewBox="0 0 13 12" fill="none"><path d="M1 10V8.2M4.3 10V6.4M7.6 10V4.6M10.9 10V2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="1" y="1" width="13" height="8" rx="2" stroke="currentColor"/><rect x="3" y="3" width="8" height="4" rx="1" fill="currentColor"/><path d="M16 4v2" stroke="currentColor" stroke-linecap="round"/></svg>
      </span>
    </div>

    <article class="notif" style="margin-top: 20px">
      <div class="notif-head">
        <span class="notif-icon"><img src="../../assets/mark-white.svg" alt=""></span>
        <span class="notif-app">Just in Case</span>
        <span class="notif-time">now</span>
      </div>
      <p class="notif-title">How to Escape from Quicksand</p>
      <p class="notif-body">Carry a stout pole. It gives you something to hold if the sand starts to pull.</p>
    </article>

    <div class="hero-stack">
      <article class="widget widget--medium hero-medium widget--solid">
        <div class="widget-row">
          <div class="widget-copy">
            <div class="widget-brand"><img src="../../assets/mark-white.svg" alt="">Just in Case</div>
            <h2 class="widget-title">How to Escape from Quicksand</h2>
            <p class="widget-desc">Spread your weight and lean back. The sand will hold you once you stop fighting it.</p>
          </div>
          <div class="widget-art"><img src="../art/quicksand.svg" alt=""></div>
        </div>
      </article>

      <article class="widget widget--small hero-small">
        <div class="widget-brand"><img src="../../assets/mark-white.svg" alt="">Today</div>
        <h2 class="widget-title">How to Break Down a Door</h2>
        <div class="widget-art"><img src="../art/door.svg" alt=""></div>
      </article>
    </div>
  </div>
</body>
</html>
